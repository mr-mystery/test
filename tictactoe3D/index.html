            board: Array(27).fill(null),

        function init() {
            // Three.js setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Create a 3x3x3 grid
            gridGroup = new THREE.Group();
            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                        const material = new THREE.MeshBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.5 });
                        const cube = new THREE.Mesh(geometry, material);
                        cube.position.set(x, y, z);
                        cube.userData.index = (x + 1) + (y + 1) * 3 + (z + 1) * 9;
                        gridGroup.add(cube);
                    }
                }
            }
            scene.add(gridGroup);

            camera.position.set(3, 3, 3);
            controls.update();

            // Firebase setup
            const gameRef = ref(database, 'games');
            const newGameRef = push(gameRef);
            game.gameId = newGameRef.key;

            onValue(child(gameRef, game.gameId), (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    game = {
                        ...game,
                        ...data,
                        board: Array.isArray(data.board) ? data.board : Array(27).fill(null)
                    };
                    updateUI();
                    updateBoard();
                }
            });

            // Set up player
            playerId = Math.random().toString(36).substr(2, 9);
            set(child(newGameRef, `players/${playerId}`), { symbol: currentSymbol });

            // Set initial game state
            set(ref(database, `games/${game.gameId}`), game);

            // Event listeners
            window.addEventListener('resize', onWindowResize, false);
            renderer.domElement.addEventListener('click', onDocumentMouseDown, false);
            document.getElementById('symbolSwitch').addEventListener('click', toggleSymbol);
            document.getElementById('resetGame').addEventListener('click', resetGame);

            animate();
            updateUI();
        }

        function toggleSymbol() {
            currentSymbol = currentSymbol === 'X' ? 'O' : 'X';
            game.players[playerId]?.symbol === 'X' ? 'O' : 'X';
            document.getElementById('playerSymbol').textContent = currentSymbol;
        }

        function resetGame() {
            // Reset the game state
            game.board = Array(27).fill(null);
            game.currentPlayer = 'X';
            game.winner = null;

            // Update Firebase with reset game state
            set(ref(database, `games/${game.gameId}`), game);

            updateUI();
            updateBoard();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

        function onDocumentMouseDown(event) {
            event.preventDefault();

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // Log the normalized mouse coordinates for debugging
            console.log("Mouse position:", mouse);

            const intersects = raycaster.intersectObjects(gridGroup.children);

            // Log intersection data
            console.log("Intersections:", intersects);

            if (intersects.length > 0) {
                const clickedCube = intersects[0].object;
                console.log("Clicked Cube:", clickedCube);

                if (clickedCube.userData.index !== undefined) {
                    const cubeIndex = clickedCube.userData.index;
                    console.log("Clicked Cube Index:", cubeIndex);

                    if (game.board[cubeIndex] === null && !game.winner) {
                        handleMove(cubeIndex);
                        console.log(game.board)
                    }
                }
            }

        function handleMove(index) {
            console.log("32423432342")

            console.log(!game.winner)
            console.log(game.players[playerId]?.symbol == currentSymbol)
            console.log(game.players[playerId]?.symbol)
            if (game.board[index] == null && !game.winner && game.players[playerId]?.symbol == currentSymbol) {
                const newBoard = [...game.board];
                newBoard[index] = currentSymbol;
                game = {
                    ...game,
                    board: newBoard,
                    currentPlayer: currentSymbol === 'X' ? 'O' : 'X',
                };

                // Check for winner
                const winner = checkWinner(newBoard);
                if (winner) {
                    game.winner = winner;
                }

                set(ref(database, `games/${game.gameId}`), game);
                updateUI();
                console.log("EHJKFDKJSHGD")
                updateBoard();
            }
        }

        function checkWinner(board) {
            const lines = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // Horizontal
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // Vertical
                [0, 4, 8], [2, 4, 6], // Diagonal
                // 3D diagonals
                [0, 4, 8], [2, 4, 6], [18, 22, 26], [20, 22, 24],
                [0, 13, 26], [2, 13, 24], [6, 13, 20], [8, 13, 18],
            ];

            for (let line of lines) {
                const [a, b, c] = line;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }

            return null;
        }

        function updateBoard() {
    // Clear old symbols
    for (let i = scene.children.length - 1; i >= 0; i--) {
        const child = scene.children[i];
        if (child !== gridGroup) {
            scene.remove(child);
        }
    }

    // Log the board state for debugging
    console.log("Board State:", game.board);

    // Render symbols
    game.board.forEach((symbol, index) => {
        if (symbol) {
            console.log(`Rendering symbol ${symbol} at index ${index}`);
            addSymbol(index, symbol);
        }
    });
}

function addSymbol(index, symbol) {
    const position = indexToPosition(index);

    let geometry, material;
    if (symbol === 'X') {
        geometry = new THREE.BoxGeometry(0.5, 0.1, 0.1);
        material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const xPart1 = new THREE.Mesh(geometry, material);
        const xPart2 = new THREE.Mesh(geometry, material);

        xPart1.position.set(...position);
        xPart2.position.set(...position);

        xPart1.rotation.z = Math.PI / 4;
        xPart2.rotation.z = -Math.PI / 4;

        scene.add(xPart1, xPart2); // Add both parts of the 'X'
    } else if (symbol === 'O') {
        geometry = new THREE.TorusGeometry(0.3, 0.1, 16, 100);
        material = new THREE.MeshBasicMaterial({ color: 0x0000ff });

        const o = new THREE.Mesh(geometry, material);
        o.position.set(...position);

        scene.add(o); // Add the 'O'
    }
}
function indexToPosition(index) {
    const x = (index % 3) - 1;
    const y = Math.floor((index % 9) / 3) - 1;
    const z = Math.floor(index / 9) - 1;
    return [x, y, z];
}
